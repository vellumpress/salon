# Static SPA at https://vellumpress.github.io/salon/ (Vite base /salon/).
# Unit tests, the reader smoke, and the production build run together.
# Deploy waits for all three. The ten-run tap stress and the full catalog
# walk run after this, in the catalog-walk workflow, and do not block it.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Unit tests
        run: npm run test:unit
        env:
          TEST_CONCURRENCY: "4"

      - name: Typecheck
        run: npm run typecheck

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The parent commit, so the sample walk can see books this push changed.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Fetch the start of this push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.before }}" || true

      - name: Reader smoke
        run: npm run test:smoke
        env:
          # Taps, sits, score, share, and the catalog sample. The ten-run
          # stress is skipped here and runs after deploy.
          TEST_SHARD: ${{ matrix.shard }}
          TEST_CONCURRENCY: "4"
          TAP_STRESS: skip
          CATALOG_WALK: sample
          CATALOG_DIFF_BASE: ${{ github.event.before }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "1"
          # Keep false: Pages has no /api/auth. Reader accounts are local-first
          # (You / login). Enabling this flag would either call a missing API
          # or treat the sandbox Dev User as signed in.
          VITE_AUTH_ENABLED: "false"
          VITE_LIVE_BACKEND: "false"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [unit, smoke, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
