<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tbr</title>
    <meta name="robots" content="noindex" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Turns /salon/read/enchanted-april?at=3#n into
      // /salon/?/read/enchanted-april&at=3#n so Pages can serve index.html.
      // Must stay >512 bytes for legacy IE custom-404 handling.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body>
    <p>Opening this page in tbr&hellip;</p>
    <noscript>
      <p>
        JavaScript is required for this address.
        <a href="/salon/">Open tbr</a>
      </p>
    </noscript>
  </body>
</html>
