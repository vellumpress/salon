# Static SPA at https://vellumpress.github.io/salon/ (Vite base /salon/).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The parent commit, so the sample walk can see books this push changed.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Fetch the start of this push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.before }}" || true

      - name: Test
        run: npm test
        env:
          # Every other test still runs. The catalog walk is the day's window,
          # books changed in this push, and the anchor books. The full walk is
          # the catalog-walk workflow, and it does not block this deploy.
          CATALOG_WALK: sample
          CATALOG_DIFF_BASE: ${{ github.event.before }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "1"
          # Keep false: Pages has no /api/auth. Reader accounts are local-first
          # (You / login). Enabling this flag would either call a missing API
          # or treat the sandbox Dev User as signed in.
          VITE_AUTH_ENABLED: "false"
          VITE_LIVE_BACKEND: "false"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
